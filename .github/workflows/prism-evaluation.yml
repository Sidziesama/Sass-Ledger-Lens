name: PRISM Evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit-trajectory:
    runs-on: ubuntu-latest
    environment: prism
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Run deterministic benchmark
        run: python -m src.evaluation.benchmark --output data/runs/benchmark-score.json

      - name: Submit complete investigation trajectory to PRISM
        env:
          PRISMTRACE_API_KEY: ${{ secrets.PRISMTRACE_API_KEY }}
          PRISMTRACE_HOST: ${{ vars.PRISMTRACE_HOST }}
          PRISMTRACE_PROJECT_ID: ${{ vars.PRISMTRACE_PROJECT_ID }}
        run: |
          python -m src.cli \
            --prior 2026-01-01 \
            --current 2026-02-01 \
            --prism \
            --output data/runs/prism-investigation.json

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v6
        with:
          name: prism-evaluation-artifacts
          path: |
            data/runs/benchmark-score.json
            data/runs/prism-investigation.json
          if-no-files-found: error
