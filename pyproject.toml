[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project]
name = "ledger-lens"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
ledger-lens = "src.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/app.py" = ["E402"] # Bootstrap the repo root before importing the local src package.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
